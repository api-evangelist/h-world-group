name: H World Group
description: >-
  H World Group Limited (formerly Huazhu Group / China Lodging Group) is one of the
  world's largest multi-brand hotel operators, headquartered in Shanghai, China and
  founded in 2005 by Ji Qi. It franchises, manages, and leases-and-operates thousands
  of hotels across economy-to-luxury tiers under brands including HanTing, Ji Hotel,
  Orange, Hi Inn, Elan, Starway, Crystal Orange, Manxin, Madison, Blossom House, CitiGO
  and Ni Hao, plus the upscale European Deutsche Hospitality portfolio (Steigenberger,
  IntercityHotel, MAXX, Jaz in the City, Zleep) and the H Rewards loyalty program. The
  company is dual-listed on NASDAQ (HTHT) and the Hong Kong Stock Exchange (1179). It
  was surfaced as a portfolio company of idg-capital and added to the API Evangelist
  network for enrichment; H World is a consumer hospitality operator and does not
  publish a public developer API surface.
